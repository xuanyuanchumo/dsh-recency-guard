# dsh-recency-guard bundle patch —— cordis Loader 入口声明。
#
# 这个文件是 dsh.bundle.patch 层：向 cordis Loader 注册一个 entry，
# 使 DSH 客户端模块系统能发现 dsh-recency-guard 的 client 半部并加入
# __DSH_BOOT__。
#
# 对照 dsh-anic/cordis.patch.yml：每个插件必须在此声明 insert entry，
# 否则 dsh.profile.bundles 只加载 host 半部，client 半部永不出现在
# Loader entries 中。
#
# disabled 表达式：若已有其他 enabled entry 挂载 dsh-recency-guard 则退让
# （防双挂载）。
- insert:
    - id: recency-guard
      name: 'dsh-recency-guard'
      disabled: !!js "[...ctx.loader.entries()].some((e) => e.options.name === 'dsh-recency-guard' && e.options.id !== 'recency-guard' && !e.disabled)"
